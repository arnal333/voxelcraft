name: World-generation smoke tests

on:
  push:
    branches: [main]
    paths-ignore:
      - 'engine/cubiomes.js'
      - 'engine/cubiomes.wasm'
      - 'engine/CUBIOMES-LICENSE.txt'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: worldgen-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build pinned Cubiomes WASM with Docker
        run: |
          docker build -f Dockerfile.emscripten -t voxelcraft-emsdk .
          docker run --rm -v "${PWD}:/workspace" -w /workspace voxelcraft-emsdk
          test -s engine/cubiomes.js
          test -s engine/cubiomes.wasm
          test -s engine/CUBIOMES-LICENSE.txt
      - name: Verify the requested seed with the compiled Cubiomes WASM
        run: node scripts/test-cubiomes-wasm.mjs
      - name: Test modular world-generation infrastructure
        run: node scripts/test-worldgen.js
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test vanilla worldgen-data extractor
        run: python scripts/test-extract-worldgen.py
      - name: Publish the generated engine for static-browser use
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f engine/cubiomes.js engine/cubiomes.wasm engine/CUBIOMES-LICENSE.txt
          if git diff --cached --quiet; then
            echo "Generated browser engine is already up to date."
          else
            git commit -m "Build Cubiomes WASM for static browser runtime [skip ci]"
            git push origin HEAD:main
          fi
